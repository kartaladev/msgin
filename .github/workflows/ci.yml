name: CI

# msgin is a multi-module monorepo (ADR 0003 / ADR 0011). go.work `use`s EIGHT
# modules: the engine (repo root), five sql-adapter modules (harness, postgres,
# mysql, sqlite, dbtest), adapter/cron/crontest and expr (Plan 027 Task 10).
# Each module MUST build and test standalone against its own go.mod, so the
# per-module jobs below force GOWORK=off (audit F5, spec 002 §8) -- the local
# go.work workspace is exercised only by the separate `workspace` job.
#
# Both jobs below cover all eight -- adapter/cron/crontest and expr were the
# pre-existing / newly-created gaps and Plan 027 Task 10 closed both.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pin the exact 1.25.x patch (CLAUDE.md "Go conventions"): a bare `go1.25`
  # is rejected by GOTOOLCHAIN ("a language version but not a toolchain
  # version"), and govulncheck flags known stdlib CVEs fixed after go1.25.0
  # (discovered while wiring this workflow -- Plan 006 Task 6), so CI runs
  # go1.25.13, not the toolchain's own default.
  #
  # Bumped go1.25.12 -> go1.25.13 during Plan 028 Task 8: govulncheck reported
  # four stdlib advisories reachable from adapter/http (GO-2026-6218 net/url,
  # GO-2026-6090 crypto/tls, GO-2026-5972 encoding/asn1, GO-2026-5026 net/http
  # via x/net/idna), all fixed in go1.25.13. No go.mod changes -- the `go
  # 1.25.0` directive is a LANGUAGE version and is unaffected.
  GOTOOLCHAIN: go1.25.13

jobs:
  module:
    name: ${{ matrix.module.name }} (GOWORK=off)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - name: engine (root)
            dir: .
          - name: harness
            dir: adapter/database/sql/harness
          - name: postgres
            dir: adapter/database/sql/postgres
          - name: mysql
            dir: adapter/database/sql/mysql
          - name: sqlite
            dir: adapter/database/sql/sqlite
          - name: dbtest
            dir: adapter/database/sql/dbtest
          - name: crontest
            dir: adapter/cron/crontest
          - name: expr
            dir: expr
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"

      - name: go build
        working-directory: ${{ matrix.module.dir }}
        run: go build ./...

      - name: go vet
        working-directory: ${{ matrix.module.dir }}
        run: go vet ./...

      - name: gofmt (fail on diff)
        working-directory: ${{ matrix.module.dir }}
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt would reformat:"
            echo "$out"
            exit 1
          fi

      - name: CGO_ENABLED=0 build
        working-directory: ${{ matrix.module.dir }}
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: go mod tidy (stability check)
        working-directory: ${{ matrix.module.dir }}
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: govulncheck
        working-directory: ${{ matrix.module.dir }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module.dir }}
          args: --timeout=5m

      # dbtest's and crontest's conformance suites need Docker
      # (testcontainers-go); the ubuntu-latest runner ships Docker
      # pre-installed and running, so no extra service setup is required for
      # either module.
      - name: go test -race
        working-directory: ${{ matrix.module.dir }}
        run: go test ./... -race -shuffle=on

  workspace:
    name: workspace build (GOWORK on)
    runs-on: ubuntu-latest
    # No GOWORK=off here: this job deliberately lets `go` auto-discover the
    # committed repo-root go.work, proving the workspace itself still resolves
    # coherently across the 8 modules enumerated below (spec 002 §8 "one
    # separate workspace-build job for the aggregate"). go.work `use`s 8, and
    # this loop now covers all of them (Plan 027 Task 10).
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"

      - name: Build every workspace member
        run: |
          set -e
          for dir in . adapter/database/sql/harness adapter/database/sql/postgres adapter/database/sql/mysql adapter/database/sql/sqlite adapter/database/sql/dbtest adapter/cron/crontest expr; do
            echo "== $dir =="
            (cd "$dir" && go build ./...)
          done
